# Xcode project generated with XcodeGen (on the build Mac: `xcodegen generate`).
name: ScreenExtender
options:
  bundleIdPrefix: it.schermoesteso
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"  # app version: change it here for every release
    CURRENT_PROJECT_VERSION: "1"
targets:
  ScreenExtender:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.schermoesteso.app
        PRODUCT_NAME: ScreenExtender
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Screen Extender
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # full-screen app: no iPadOS bar over the picture
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UILaunchScreen:
          UIColorName: ""
        # portrait too: the virtual screen rotates with the device (can be locked from the menu)
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # appears in the Share sheet of other apps: the file arrives here and goes to the PC
        CFBundleDocumentTypes:
          - CFBundleTypeName: Qualsiasi file
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.item
              - public.data
              - public.content
        LSSupportsOpeningDocumentsInPlace: false
        NSPhotoLibraryUsageDescription: "Serve per scegliere foto e video da inviare al PC."
        NSLocalNetworkUsageDescription: "Serve per collegarsi al PC con Screen Extender sulla tua rete."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
