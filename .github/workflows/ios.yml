# Builds the iPad app on a Mac in the GitHub cloud and publishes it as an .ipa file.
# The app comes out unsigned: AltStore/SideStore signs it with the Apple ID, on the iPad.
name: App iPad

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Compila
        working-directory: ios
        run: |
          # build number: the GitHub run number, which always goes up,
          # so iOS sees every ipa as an update. The version (1.1.0...) is in ios/project.yml
          N=${{ github.run_number }}
          xcodebuild -quiet -project SchermoEsteso.xcodeproj -scheme SchermoEsteso \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=$N CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Crea il file .ipa
        run: |
          mkdir -p Payload
          cp -R ios/build/Build/Products/Release-iphoneos/SchermoEsteso.app Payload/
          zip -qry SchermoEsteso.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SchermoEsteso-ipa
          path: SchermoEsteso.ipa
          retention-days: 30
